<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Management</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#677084; --line:#e2e5eb;
  --primary:#3558d6; --primary-ink:#fff;
  --annual:#3b6fe0; --medical:#17a58a; --unpaid:#d08a1f;
  --ok:#1a8f4d; --bad:#c93a3a; --warn:#b7791f; --warnbg:#fff4de;
  --weekend:#eef0f4; --holiday:#fde8e8; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12151c;--card:#1b2029;--text:#e7eaf0;--muted:#98a1b3;--line:#2b3240;--weekend:#232936;--holiday:#3a2326;--warnbg:#3a2f18;--primary:#6b8cff;--primary-ink:#0d1220}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
main{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
nav button.active{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.balances{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bal{border-left:5px solid var(--c);}
.bal .big{font-size:30px;font-weight:700}
.bal table{width:100%;font-size:13px;color:var(--muted);margin-top:6px}
.bal td:last-child{text-align:right;color:var(--text)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0;display:flex}
.bar i{display:block;height:100%}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{resize:vertical;min-height:64px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{margin-bottom:12px}
button.btn{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
button.approve{background:var(--ok);color:#fff;border-color:var(--ok)}
button.reject{background:var(--bad);color:#fff;border-color:var(--bad)}
button.link{background:none;border:0;color:var(--primary);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.preview{padding:10px 12px;border-radius:8px;background:var(--bg);border:1px dashed var(--line);margin-bottom:12px;font-size:14px}
.preview.err{color:var(--bad);border-color:var(--bad)}
.preview b{font-size:18px}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;color:#fff;background:var(--c,#888);white-space:nowrap}
.st-pending{background:var(--warnbg);color:var(--warn)}
.st-approved{background:#dff5e8;color:var(--ok)}
.st-rejected{background:#fbe1e1;color:var(--bad)}
.st-cancelled{background:var(--line);color:var(--muted)}
.st{font-size:12px;padding:2px 9px;border-radius:999px}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
table.list th{color:var(--muted);font-weight:500;font-size:12px}
.req{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--card)}
.req-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.overlap{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px}
.overlap.none{background:#e6f6ec;color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions input{flex:1 1 220px;width:auto}
.cal-wrap{overflow-x:auto}
.cal{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.cal th,.cal td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0;min-width:26px;height:30px}
.cal th{font-weight:500;color:var(--muted);background:var(--card)}
.cal td.name,.cal th.name{text-align:left;padding:0 10px;min-width:130px;position:sticky;left:0;background:var(--card);z-index:1;white-space:nowrap}
.cal .we{background:var(--weekend)}
.cal .ph{background:var(--holiday)}
.cal td.today,.cal th.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal .leave{background:var(--c);color:#fff}
.cal .leave.pending{background:repeating-linear-gradient(45deg,var(--c),var(--c) 4px,transparent 4px,transparent 8px);color:var(--text);outline:1px solid var(--c);outline-offset:-1px}
.cal .focus{box-shadow:inset 0 0 0 3px #000}
.cal .count.hot{background:var(--bad);color:#fff;font-weight:700}
.cal .count.warm{background:var(--warnbg);color:var(--warn);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;background:var(--c)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{margin:0 8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:10}
.who{display:flex;gap:8px;align-items:center}
.who select{width:auto}
@media (max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🗓 Leave Management</h1>
  <div class="who">
    <label for="userSel" style="margin:0">Signed in as</label>
    <select id="userSel"></select>
  </div>
</header>
<main>
  <nav id="nav"></nav>
  <div id="view"></div>
</main>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- constants & helpers ---------- */
const TYPES = {
  annual:  {label:'Annual leave',  color:'var(--annual)',  entitlement:18},
  medical: {label:'Medical leave', color:'var(--medical)', entitlement:14},
  unpaid:  {label:'Unpaid leave',  color:'var(--unpaid)',  entitlement:null} // no cap
};
const STORE_KEY = 'leave-tracker-v1';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const OVERLAP_WARN = 2; // people off on the same day before the calendar flags it

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtRange = r => r.start === r.end ? fmt(r.start) : `${fmt(r.start)} – ${fmt(r.end)}`;
const TODAY = iso(new Date());

/* ---------- state ---------- */
function seed(){
  return {
    users: [
      {id:'u1', name:'Maya Patel',  role:'manager',  title:'Team Manager'},
      {id:'u2', name:'Alice Tan',   role:'employee', title:'Designer'},
      {id:'u3', name:'Ben Okafor',  role:'employee', title:'Developer'},
      {id:'u4', name:'Chloe Lim',   role:'employee', title:'Developer'},
      {id:'u5', name:'Dev Sharma',  role:'employee', title:'QA Engineer'}
    ],
    holidays: [
      {date:'2026-12-25', name:'Christmas Day'},
      {date:'2027-01-01', name:"New Year's Day"},
      {date:'2027-03-26', name:'Good Friday'},
      {date:'2027-05-01', name:'Labour Day'},
      {date:'2027-12-25', name:'Christmas Day'}
    ],
    requests: [
      {id:'r1', userId:'u3', type:'annual',  start:'2026-12-21', end:'2026-12-31', days:8, reason:'Year-end holiday',      status:'approved', comment:'Enjoy!', created:'2026-11-02', decidedBy:'u1'},
      {id:'r2', userId:'u4', type:'annual',  start:'2026-12-28', end:'2027-01-05', days:6, reason:'Family trip',            status:'approved', comment:'',       created:'2026-11-10', decidedBy:'u1'},
      {id:'r3', userId:'u2', type:'annual',  start:'2026-12-29', end:'2027-01-04', days:4, reason:'Visiting relatives',    status:'pending',  comment:'',       created:'2026-11-20'},
      {id:'r4', userId:'u5', type:'medical', start:'2026-11-16', end:'2026-11-17', days:2, reason:'Flu',                    status:'approved', comment:'Get well soon', created:'2026-11-16', decidedBy:'u1'},
      {id:'r5', userId:'u5', type:'annual',  start:'2026-12-30', end:'2027-01-04', days:3, reason:'New Year break',        status:'pending',  comment:'',       created:'2026-11-22'},
      {id:'r6', userId:'u2', type:'unpaid',  start:'2026-10-12', end:'2026-10-14', days:3, reason:'Personal matter',       status:'rejected', comment:'Release deadline that week', created:'2026-10-01', decidedBy:'u1'}
    ],
    currentUser:'u2'
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(STORE_KEY)) || seed(); } catch(e){ S = seed(); }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} };

const ui = { tab:'mine', calYear:new Date().getFullYear(), calMonth:new Date().getMonth(), showPending:true, focus:null };

const user = id => S.users.find(u => u.id === id);
const me = () => user(S.currentUser);
const isManager = () => me().role === 'manager';
const holidaySet = () => new Set(S.holidays.map(h => h.date));

/* ---------- business logic ---------- */
// Working days between two ISO dates inclusive, skipping Sat/Sun and public holidays.
function workingDays(start, end){
  if(!start || !end || end < start) return 0;
  const hol = holidaySet();
  let n = 0;
  for(let d = parse(start); iso(d) <= end; d = addDays(d,1)){
    const dow = d.getDay();
    if(dow !== 0 && dow !== 6 && !hol.has(iso(d))) n++;
  }
  return n;
}
const rangesOverlap = (a,b) => a.start <= b.end && b.start <= a.end;

function balance(userId, type){
  const reqs = S.requests.filter(r => r.userId === userId && r.type === type);
  const taken   = reqs.filter(r => r.status==='approved').reduce((s,r)=>s+r.days,0);
  const pending = reqs.filter(r => r.status==='pending').reduce((s,r)=>s+r.days,0);
  const ent = TYPES[type].entitlement;
  return {ent, taken, pending, remaining: ent===null ? null : ent - taken};
}

function overlapsFor(req){
  return S.requests.filter(o => o.id !== req.id && o.userId !== req.userId &&
    (o.status==='approved' || o.status==='pending') && rangesOverlap(o, req));
}

/* ---------- UI ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden = true, 2800);
}

function renderHeader(){
  const sel = document.getElementById('userSel');
  sel.innerHTML = S.users.map(u => `<option value="${u.id}" ${u.id===S.currentUser?'selected':''}>${esc(u.name)} (${u.role})</option>`).join('');
  const pend = isManager() ? S.requests.filter(r => r.status==='pending' && r.userId !== me().id).length : 0;
  const tabs = [['mine','My leave'], ['calendar','Team calendar']];
  if(isManager()) tabs.splice(1,0,['approvals','Approvals' + (pend?`<span class="badge">${pend}</span>`:'')]);
  tabs.push(['holidays','Public holidays']);
  if(!tabs.some(t=>t[0]===ui.tab)) ui.tab = 'mine';
  document.getElementById('nav').innerHTML = tabs.map(([k,l]) =>
    `<button data-tab="${k}" class="${ui.tab===k?'active':''}">${l}</button>`).join('');
}

function render(){
  renderHeader();
  const v = document.getElementById('view');
  v.innerHTML = ({mine:viewMine, approvals:viewApprovals, calendar:viewCalendar, holidays:viewHolidays})[ui.tab]();
  if(ui.tab==='mine') updatePreview();
}

/* --- My leave --- */
function balanceCard(userId, type){
  const b = balance(userId, type), t = TYPES[type];
  const pct = x => b.ent ? Math.min(100, x / b.ent * 100) : 0;
  return `<div class="card bal" style="--c:${t.color};margin:0">
    <div class="muted">${t.label}</div>
    <div class="big">${b.ent===null ? '—' : b.remaining}<span class="muted" style="font-size:14px;font-weight:400"> ${b.ent===null?'no cap':'days left'}</span></div>
    ${b.ent===null ? '' : `<div class="bar"><i style="width:${pct(b.taken)}%;background:${t.color}"></i><i style="width:${pct(b.pending)}%;background:${t.color};opacity:.4"></i></div>`}
    <table>
      <tr><td>Entitlement</td><td>${b.ent===null?'Unlimited':b.ent+' days'}</td></tr>
      <tr><td>Taken (approved)</td><td>${b.taken} days</td></tr>
      <tr><td>Pending approval</td><td>${b.pending} days</td></tr>
      <tr><td>Remaining</td><td><b>${b.ent===null?'n/a':b.remaining+' days'}</b></td></tr>
    </table></div>`;
}

function viewMine(){
  const u = me();
  const mine = S.requests.filter(r => r.userId === u.id).sort((a,b)=> b.start.localeCompare(a.start));
  return `
  <h2>${esc(u.name)} <span class="muted">· ${esc(u.title)}</span></h2>
  <div class="grid balances" style="margin-bottom:16px">${Object.keys(TYPES).map(t=>balanceCard(u.id,t)).join('')}</div>
  <div class="grid two">
    <form class="card" id="applyForm" style="margin:0" novalidate>
      <h2>Apply for leave</h2>
      <div class="field"><label for="fType">Leave type</label>
        <select id="fType">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t.label}</option>`).join('')}</select></div>
      <div class="row">
        <div><label for="fStart">From</label><input type="date" id="fStart" value="${TODAY}"></div>
        <div><label for="fEnd">To</label><input type="date" id="fEnd" value="${TODAY}"></div>
      </div>
      <div class="field"><label for="fReason">Reason</label><textarea id="fReason" placeholder="Briefly explain the reason for your leave"></textarea></div>
      <div id="preview" class="preview"></div>
      <button class="btn primary" type="submit">Submit request</button>
    </form>
    <div class="card" style="margin:0">
      <h2>My requests</h2>
      ${mine.length ? `<table class="list"><thead><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr></thead><tbody>
        ${mine.map(r=>`<tr>
          <td><span class="pill" style="--c:${TYPES[r.type].color}">${TYPES[r.type].label.split(' ')[0]}</span></td>
          <td>${fmtRange(r)}<div class="muted">${esc(r.reason)}</div>${r.comment?`<div class="muted">💬 ${esc(r.comment)}</div>`:''}</td>
          <td>${r.days}</td>
          <td><span class="st st-${r.status}">${r.status}</span></td>
          <td>${r.status==='pending'?`<button class="link" data-act="cancel" data-id="${r.id}">Cancel</button>`:''}</td>
        </tr>`).join('')}</tbody></table>` : `<p class="muted">No requests yet.</p>`}
    </div>
  </div>`;
}

// Validate the form and return {days, error, warn}
function evaluateForm(){
  const type = document.getElementById('fType').value;
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  if(!start || !end) return {error:'Pick a start and end date.'};
  if(end < start) return {error:'The end date is before the start date.'};
  const days = workingDays(start, end);
  const total = Math.round((parse(end)-parse(start))/864e5)+1;
  if(days === 0) return {days, total, error:'That range has no working days (weekends/public holidays only).'};
  const clash = S.requests.find(r => r.userId===S.currentUser && (r.status==='pending'||r.status==='approved') && rangesOverlap(r,{start,end}));
  if(clash) return {days, total, error:`Overlaps your ${clash.status} request (${fmtRange(clash)}).`};
  const b = balance(S.currentUser, type);
  if(b.ent !== null && days > b.remaining - b.pending)
    return {days, total, error:`Not enough ${TYPES[type].label.toLowerCase()} — you have ${b.remaining - b.pending} day(s) available after pending requests.`};
  return {days, total, type, start, end};
}

function updatePreview(){
  const p = document.getElementById('preview'); if(!p) return;
  const r = evaluateForm();
  if(r.days !== undefined){
    const skipped = r.total - r.days;
    p.innerHTML = `<b>${r.days}</b> working day${r.days===1?'':'s'} <span class="muted">(${r.total} calendar days, ${skipped} weekend/holiday excluded)</span>` +
      (r.error ? `<div style="margin-top:4px">⚠ ${esc(r.error)}</div>` : '');
  } else p.innerHTML = r.error ? `⚠ ${esc(r.error)}` : '';
  p.className = 'preview' + (r.error ? ' err' : '');
}

function submitForm(){
  const r = evaluateForm();
  const reason = document.getElementById('fReason').value.trim();
  if(r.error){ updatePreview(); return toast(r.error); }
  if(!reason){ document.getElementById('fReason').focus(); return toast('Please give a reason.'); }
  S.requests.push({id:'r'+Date.now(), userId:S.currentUser, type:r.type, start:r.start, end:r.end,
    days:r.days, reason, status:'pending', comment:'', created:TODAY});
  save(); render(); toast('Request submitted for approval.');
}

/* --- Approvals --- */
function viewApprovals(){
  const queue = S.requests.filter(r => r.status==='pending' && r.userId !== me().id).sort((a,b)=>a.start.localeCompare(b.start));
  const done = S.requests.filter(r => r.status==='approved'||r.status==='rejected').sort((a,b)=>b.start.localeCompare(a.start));
  return `<h2>Approval queue</h2>
  ${queue.length ? queue.map(reqCard).join('') : `<div class="card muted">🎉 Nothing waiting for approval.</div>`}
  <h2 style="margin-top:24px">Recent decisions</h2>
  <div class="card">${done.length ? `<table class="list"><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Decision</th></tr></thead><tbody>
    ${done.map(r=>`<tr><td>${esc(user(r.userId).name)}</td><td>${TYPES[r.type].label}</td><td>${fmtRange(r)}</td><td>${r.days}</td>
      <td><span class="st st-${r.status}">${r.status}</span>${r.comment?`<div class="muted">💬 ${esc(r.comment)}</div>`:''}</td></tr>`).join('')}
    </tbody></table>` : '<span class="muted">None yet.</span>'}</div>`;
}

function reqCard(r){
  const u = user(r.userId), t = TYPES[r.type], b = balance(r.userId, r.type);
  const ov = overlapsFor(r);
  const afterBal = b.ent===null ? 'n/a (unpaid)' : `${b.remaining - r.days} of ${b.ent} days`;
  return `<div class="req" data-card="${r.id}">
    <div class="req-head">
      <div><b>${esc(u.name)}</b> <span class="muted">· ${esc(u.title)}</span></div>
      <span class="pill" style="--c:${t.color}">${t.label}</span>
    </div>
    <div>${fmtRange(r)} — <b>${r.days}</b> working day${r.days===1?'':'s'}</div>
    <div class="muted">“${esc(r.reason)}” · requested ${fmt(r.created)}</div>
    <div class="muted">Balance after approval: ${afterBal}</div>
    <div class="overlap ${ov.length?'':'none'}">
      ${ov.length ? `⚠ <b>${ov.length} teammate${ov.length>1?'s':''} also off</b> during this period:<ul style="margin:6px 0 0;padding-left:18px">
        ${ov.map(o=>`<li>${esc(user(o.userId).name)} — ${fmtRange(o)} <span class="st st-${o.status}">${o.status}</span></li>`).join('')}</ul>`
        : '✓ No overlapping leave in the team.'}
      <div style="margin-top:6px"><button class="link" data-act="viewcal" data-id="${r.id}">View in team calendar →</button></div>
    </div>
    <div class="actions">
      <input type="text" id="cm-${r.id}" placeholder="Comment (required when rejecting)" aria-label="Comment">
      <button class="btn approve" data-act="approve" data-id="${r.id}">Approve</button>
      <button class="btn reject" data-act="reject" data-id="${r.id}">Reject</button>
    </div>
  </div>`;
}

function decide(id, status){
  const r = S.requests.find(x => x.id === id);
  const comment = document.getElementById('cm-'+id).value.trim();
  if(status==='rejected' && !comment){ document.getElementById('cm-'+id).focus(); return toast('Add a comment explaining the rejection.'); }
  if(status==='approved' && r.days > 0){
    const b = balance(r.userId, r.type);
    if(b.ent !== null && r.days > b.remaining) return toast('Employee does not have enough balance to approve.');
  }
  r.status = status; r.comment = comment; r.decidedBy = S.currentUser;
  save(); render(); toast(`Request ${status}.`);
}

/* --- Team calendar --- */
function viewCalendar(){
  const y = ui.calYear, m = ui.calMonth;
  const nDays = new Date(y, m+1, 0).getDate();
  const hol = new Map(S.holidays.map(h=>[h.date,h.name]));
  const statuses = ui.showPending ? ['approved','pending'] : ['approved'];
  const reqs = S.requests.filter(r => statuses.includes(r.status));
  const focus = ui.focus ? S.requests.find(r=>r.id===ui.focus) : null;
  const days = Array.from({length:nDays}, (_,i)=> {
    const d = new Date(y,m,i+1); return {n:i+1, iso:iso(d), dow:d.getDay()};
  });
  const cls = d => [d.dow===0||d.dow===6?'we':'', hol.has(d.iso)?'ph':'', d.iso===TODAY?'today':''].join(' ');
  const find = (uid,date) => reqs.find(r => r.userId===uid && r.start<=date && date<=r.end);
  const counts = days.map(d => S.users.filter(u=>find(u.id,d.iso)).length);

  return `<div class="card">
    <div class="toolbar">
      <button class="btn" data-act="prev" aria-label="Previous month">‹</button>
      <h2>${MONTHS[m]} ${y}</h2>
      <button class="btn" data-act="next" aria-label="Next month">›</button>
      <button class="btn" data-act="today">Today</button>
      <label style="margin:0 0 0 auto;display:flex;gap:6px;align-items:center"><input type="checkbox" id="showPend" style="width:auto" ${ui.showPending?'checked':''}> Show pending</label>
    </div>
    ${focus ? `<div class="overlap">Highlighting <b>${esc(user(focus.userId).name)}</b>'s pending request (${fmtRange(focus)}).
      <button class="link" data-act="clearfocus">Clear</button>
      ${isManager()?` · <button class="link" data-tab="approvals">Back to approvals</button>`:''}</div>` : ''}
    <div class="cal-wrap"><table class="cal">
      <thead><tr><th class="name">Team member</th>${days.map(d=>`<th class="${cls(d)}" title="${hol.get(d.iso)||''}">${d.n}<div style="font-size:10px">${'SMTWTFS'[d.dow]}</div></th>`).join('')}</tr></thead>
      <tbody>
      ${S.users.map(u=>`<tr><td class="name">${esc(u.name)}</td>${days.map(d=>{
        const r = find(u.id,d.iso);
        const f = focus && r && r.id===focus.id ? ' focus' : '';
        const hl = focus && !r && u.id!==focus.userId && d.iso>=focus.start && d.iso<=focus.end && d.dow%6!==0 && !hol.has(d.iso) ? '' : '';
        return r ? `<td class="${cls(d)} leave ${r.status}${f}" style="--c:${TYPES[r.type].color}" title="${esc(u.name)} · ${TYPES[r.type].label} (${r.status})">${r.status==='pending'?'?':''}</td>`
                 : `<td class="${cls(d)}"></td>`;
      }).join('')}</tr>`).join('')}
      <tr><td class="name"><b>People off</b></td>${days.map((d,i)=>`<td class="count ${counts[i]>=OVERLAP_WARN+1?'hot':counts[i]>=OVERLAP_WARN?'warm':''}">${counts[i]||''}</td>`).join('')}</tr>
      </tbody></table></div>
    <div class="legend">
      ${Object.values(TYPES).map(t=>`<span><i class="sw" style="--c:${t.color}"></i>${t.label}</span>`).join('')}
      <span>Hatched “?” = pending</span>
      <span><i class="sw" style="--c:var(--weekend)"></i>Weekend</span>
      <span><i class="sw" style="--c:var(--holiday)"></i>Public holiday</span>
      <span>“People off” turns amber at ${OVERLAP_WARN}, red at ${OVERLAP_WARN+1}+</span>
    </div></div>`;
}

/* --- Holidays --- */
function viewHolidays(){
  const list = [...S.holidays].sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="card"><h2>Public holidays</h2>
    <p class="muted">Public holidays are excluded when working days are calculated. Edit this list to match your country.</p>
    <table class="list"><tbody>${list.map(h=>`<tr><td>${fmt(h.date)} <span class="muted">(${parse(h.date).toLocaleDateString('en-GB',{weekday:'short'})})</span></td><td>${esc(h.name)}</td>
      <td>${isManager()?`<button class="link" data-act="delhol" data-id="${h.date}">Remove</button>`:''}</td></tr>`).join('')}</tbody></table>
    ${isManager() ? `<form id="holForm" class="actions" style="margin-top:12px">
      <input type="date" id="hDate" required style="flex:0 0 170px"><input type="text" id="hName" placeholder="Holiday name" required>
      <button class="btn primary" type="submit">Add holiday</button></form>`
      : `<p class="muted">Only managers can edit holidays.</p>`}
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <button class="btn" data-act="reset">Reset demo data</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if(tab){ ui.tab = tab.dataset.tab; if(ui.tab!=='calendar') ui.focus = null; return render(); }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const id = a.dataset.id;
  switch(a.dataset.act){
    case 'approve': return decide(id,'approved');
    case 'reject':  return decide(id,'rejected');
    case 'cancel':  { const r = S.requests.find(x=>x.id===id); r.status='cancelled'; save(); render(); return toast('Request cancelled.'); }
    case 'viewcal': { const r = S.requests.find(x=>x.id===id); const d = parse(r.start);
                      ui.calYear = d.getFullYear(); ui.calMonth = d.getMonth(); ui.focus = id; ui.showPending = true; ui.tab='calendar'; return render(); }
    case 'clearfocus': ui.focus = null; return render();
    case 'prev': ui.calMonth--; if(ui.calMonth<0){ui.calMonth=11;ui.calYear--} return render();
    case 'next': ui.calMonth++; if(ui.calMonth>11){ui.calMonth=0;ui.calYear++} return render();
    case 'today': { const d=new Date(); ui.calYear=d.getFullYear(); ui.calMonth=d.getMonth(); return render(); }
    case 'delhol': S.holidays = S.holidays.filter(h=>h.date!==id); save(); return render();
    case 'reset': if(confirm('Reset all data to the demo set?')){ const cu=S.currentUser; S=seed(); S.currentUser=cu; save(); render(); } return;
  }
});
document.addEventListener('input', e => {
  if(['fType','fStart','fEnd'].includes(e.target.id)){
    if(e.target.id==='fStart'){ const end=document.getElementById('fEnd'); if(end.value < e.target.value) end.value = e.target.value; }
    updatePreview();
  }
});
document.addEventListener('change', e => {
  if(e.target.id==='showPend'){ ui.showPending = e.target.checked; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id==='applyForm') submitForm();
  if(e.target.id==='holForm'){
    const date = document.getElementById('hDate').value, name = document.getElementById('hName').value.trim();
    if(date && name && !S.holidays.some(h=>h.date===date)){ S.holidays.push({date,name}); save(); render(); toast('Holiday added. Pending requests keep their original day count.'); }
  }
});
document.getElementById('userSel').addEventListener('change', e => { S.currentUser = e.target.value; save(); render(); });

render();
</script>
</body>
</html>
